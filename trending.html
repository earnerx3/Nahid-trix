<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trending | NAHID TRIX Store</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* === iOS LIGHT THEME === */
        :root {
            --bg-main: #f2f2f7;          
            --bg-card: #ffffff;          
            --text-main: #1c1c1e;        
            --text-muted: #8e8e93;       
            
            --color-nahid-1: #ffb300;    
            --color-nahid-2: #ff9800;    
            --color-trix: #00bcd4;       
            --color-pink: #ff2d55;       
            --ios-blue: #007aff;         
            --ios-red: #ff3b30;
            --ios-green: #34c759;
            
            --border-color: #e5e5ea;     
            --shadow-soft: 0 4px 14px rgba(0,0,0,0.06);
            --shadow-hover: 0 10px 25px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-bottom: 85px; 
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased; 
        }

        /* ====== HEADER ====== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 18px; 
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 0.5px solid var(--border-color);
            height: 40px; 
            transition: 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 17px; 
            font-weight: 800;
            letter-spacing: 0.5px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px; 
        }

        .logo-img {
            width: 26px; height: 26px; border-radius: 8px; 
            object-fit: cover; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .logo .nahid {
            background: linear-gradient(to right, #ff9800, #ff5722);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .logo .trix { color: var(--text-main); }
        .logo .trix span { color: var(--color-trix); }

        /* ====== SMART SEARCH ====== */
        .search-container { display: flex; align-items: center; justify-content: flex-end; position: relative; flex-grow: 1; }
        .search-input-wrapper {
            width: 0; opacity: 0; overflow: hidden; display: flex; align-items: center;
            background: #e3e3e8; border-radius: 10px; height: 34px;
            transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease;
            position: absolute; right: 35px; 
        }
        .search-input-wrapper.active { width: calc(100vw - 80px); max-width: 400px; opacity: 1; padding: 0 10px; }
        .search-input-wrapper input {
            width: 100%; padding: 0 8px; border: none; background: transparent;
            font-family: 'Poppins', sans-serif; font-size: 14px; outline: none; color: var(--text-main);
        }
        .search-input-wrapper input::placeholder { color: var(--text-muted); font-weight: 400; }
        .search-toggle-btn {
            font-size: 16px; color: var(--ios-blue); width: 30px; height: 30px;
            display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 1001; transition: 0.3s;
        }
        .search-toggle-btn:active { transform: scale(0.85); }
        .search-toggle-btn.active { color: var(--ios-red); transform: rotate(90deg); }
        header.search-active .logo { opacity: 0; transform: translateX(-20px); pointer-events: none; }

        .suggestions-list {
            display: none; position: absolute; top: 50px; right: 18px; width: calc(100vw - 36px); max-width: 400px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1); list-style: none; padding: 10px 0; margin: 0;
            max-height: 300px; overflow-y: auto; border-radius: 16px; border: 0.5px solid var(--border-color); z-index: 1000;
        }
        .suggestions-list .ai-header { font-size: 11px; font-weight: 600; color: var(--ios-blue); padding: 5px 20px 10px; text-transform: uppercase; }
        .suggestions-list li { padding: 12px 20px; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 12px; }
        .suggestions-list li i { color: var(--text-muted); font-size: 12px; }
        .suggestions-list li .highlight { font-weight: 700; color: var(--ios-blue); }

        /* ====== PAGE HEADER & CATEGORIES ====== */
        .page-header { padding: 20px 20px 10px; }
        .page-title { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin: 0 0 15px 0; display: flex; align-items: center; gap: 8px; }
        .filter-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .filter-scroll::-webkit-scrollbar { display: none; } 
        .filter-pill {
            background: #e5e5ea; color: var(--text-main); padding: 8px 18px; border-radius: 20px;
            font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; transition: 0.2s;
        }
        .filter-pill.active { background: var(--text-main); color: #fff; }

        /* ====== NEW: HORIZONTAL HERO SLIDER (Line System) ====== */
        .section-label { padding: 15px 20px 5px; font-size: 16px; font-weight: 700; color: var(--text-muted); }
        .hero-slider {
            display: flex; overflow-x: auto; gap: 15px; padding: 10px 20px 20px;
            scroll-snap-type: x mandatory; scrollbar-width: none;
        }
        .hero-slider::-webkit-scrollbar { display: none; }
        
        .hero-card {
            min-width: 85%; scroll-snap-align: center; background: var(--bg-card);
            border-radius: 24px; overflow: hidden; box-shadow: var(--shadow-soft);
            text-decoration: none; color: inherit; position: relative; transition: 0.2s;
            display: flex; flex-direction: column;
        }
        .hero-card:active { transform: scale(0.97); }
        .hero-badge {
            position: absolute; top: 12px; left: 12px; background: rgba(255,45,85,0.9); backdrop-filter: blur(5px);
            color: #fff; padding: 5px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 4px; z-index: 2;
        }
        .hero-img { width: 100%; height: 160px; object-fit: cover; background: #e5e5ea; }
        .hero-info { padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .hero-text-box { display: flex; flex-direction: column; gap: 4px; }
        .hero-name { font-size: 16px; font-weight: 700; }
        .hero-cat { font-size: 12px; color: var(--text-muted); }
        .hero-btn { background: var(--bg-main); color: var(--ios-blue); padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 13px; }

        /* ====== NEW: SLEEK VERTICAL LIST (No Numbers) ====== */
        .sleek-list { padding: 0 15px 20px; display: flex; flex-direction: column; gap: 12px; max-width: 800px; margin: 0 auto; }
        .sleek-item {
            display: flex; align-items: center; background: var(--bg-card); border-radius: 18px; padding: 12px;
            box-shadow: var(--shadow-soft); text-decoration: none; color: inherit; transition: 0.2s;
        }
        .sleek-item:active { transform: scale(0.97); }
        .sleek-img { width: 70px; height: 70px; border-radius: 14px; object-fit: cover; margin-right: 15px; background: #e5e5ea; }
        .sleek-info { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        .sleek-name { font-size: 15px; font-weight: 700; margin-bottom: 2px; color: var(--text-main); display: flex; align-items: center; gap: 6px; }
        .trend-icon { color: var(--color-nahid-2); font-size: 13px; }
        .sleek-category { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
        .sleek-stats { display: flex; gap: 10px; font-size: 11px; color: var(--text-muted); font-weight: 500; }
        .stat-badge { background: var(--bg-main); padding: 3px 8px; border-radius: 8px; display: flex; align-items: center; gap: 4px; }
        
        .sleek-action { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 6px; }
        .sleek-price { font-size: 15px; font-weight: 800; color: var(--text-main); }
        .sleek-btn { font-size: 12px; padding: 6px 16px; border-radius: 16px; background: rgba(0, 122, 255, 0.1); color: var(--ios-blue); font-weight: 700; }

        .loading-text { text-align: center; padding: 40px 20px; font-size: 14px; font-weight: 500; color: var(--text-muted); }

        /* ====== BOTTOM NAVIGATION & AUTH MODAL ====== */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border-top: 0.5px solid var(--border-color);
            display: flex; justify-content: space-around; padding: 10px 0 20px 0; z-index: 1000;
        }
        .nav-link { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--text-muted); font-size: 9.5px; font-weight: 500; gap: 4px; }
        .nav-link i { font-size: 18px; } 
        .nav-link.active { color: var(--ios-blue); }

        /* AUTH MODAL */
        .auth-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            z-index: 9999; display: none; align-items: center; justify-content: center; opacity: 0; transition: 0.3s;
        }
        .auth-overlay.show { display: flex; opacity: 1; }
        .auth-modal {
            background: var(--bg-card); width: 85%; max-width: 340px; border-radius: 24px; padding: 30px 20px 20px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); transform: scale(0.9); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .auth-overlay.show .auth-modal { transform: scale(1); }
        .auth-icon {
            width: 60px; height: 60px; background: rgba(0, 122, 255, 0.1); color: var(--ios-blue); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 15px;
        }
        .auth-title { font-size: 18px; font-weight: 700; color: var(--text-main); margin-bottom: 8px; }
        .auth-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 25px; line-height: 1.4; }
        .auth-btn-group { display: flex; gap: 10px; }
        .auth-btn { flex: 1; padding: 12px; border-radius: 14px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; }
        .btn-cancel { background: #f2f2f7; color: var(--text-main); }
        .btn-login { background: var(--ios-blue); color: #fff; }
    </style>
</head>
<body>

    <header id="mainHeader">
        <a href="index.html" class="logo">
            <img src="https://ui-avatars.com/api/?name=NT&background=ff9800&color=fff" alt="Logo" class="logo-img">
            <span class="nahid">NAHID</span> <span class="trix">TRIX</span>
        </a>
        <div class="search-container">
            <div class="search-input-wrapper" id="searchInputWrapper">
                <input type="text" id="searchInput" placeholder="Search trends..." autocomplete="off">
            </div>
            <div class="search-toggle-btn" id="searchToggleBtn"><i class="fas fa-search" id="searchIcon"></i></div>
        </div>
        <ul class="suggestions-list" id="suggestionsBox"></ul>
    </header>

    <div class="page-header">
        <h1 class="page-title">Discover <i class="fas fa-sparkles" style="color:var(--color-nahid-1); font-size: 20px;"></i></h1>
        <div class="filter-scroll">
            <div class="filter-pill active">All Trends</div>
            <div class="filter-pill">Highest Sold</div>
            <div class="filter-pill">Top Viewed</div>
            <div class="filter-pill">Free Bots</div>
        </div>
    </div>

    <div class="section-label">Top Grossing 🔥</div>
    <div class="hero-slider" id="topChartsSlider">
        </div>

    <div class="section-label" style="margin-top: 5px;">Trending Now 🚀</div>
    <main class="sleek-list" id="trendingList">
        <div class="loading-text"><i class="fas fa-spinner fa-spin"></i> Analyzing Data...</div>
    </main>

    <div class="auth-overlay" id="authOverlay">
        <div class="auth-modal">
            <div class="auth-icon"><i class="fas fa-lock"></i></div>
            <div class="auth-title">Login Required</div>
            <div class="auth-desc">You need to log in or create an account to access this feature.</div>
            <div class="auth-btn-group">
                <button class="auth-btn btn-cancel" onclick="closeAuthModal()">Cancel</button>
                <button class="auth-btn btn-login" onclick="triggerHaptic(); window.location.href='auth.html'">Login Now</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-link"><i class="fas fa-layer-group"></i><span>Apps</span></a>
        <a href="feed.html" class="nav-link"><i class="fas fa-stream"></i><span>Feed</span></a>
        <a href="trending.html" class="nav-link active"><i class="fas fa-fire"></i><span>Trending</span></a>
        <a href="orders.html" class="nav-link" onclick="checkAuthAccess(event, 'orders.html')"><i class="fas fa-wallet"></i><span>Wallet</span></a>
        <a href="profile.html" class="nav-link" onclick="checkAuthAccess(event, 'profile.html')"><i class="fas fa-user-circle"></i><span>Profile</span></a>
    </nav>

    <script>
        const tg = window.Telegram?.WebApp;
        if(tg) tg.expand();

        function triggerHaptic() {
            if (navigator.vibrate) navigator.vibrate(50);
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        // --- AUTH CHECKER ---
        function showAuthModal() { triggerHaptic(); document.getElementById('authOverlay').classList.add('show'); }
        function closeAuthModal() { triggerHaptic(); document.getElementById('authOverlay').classList.remove('show'); }
        function checkAuthAccess(event, targetUrl) {
            event.preventDefault();
            const isLoggedIn = localStorage.getItem('nahidStore_isLoggedIn') === 'true';
            if (isLoggedIn) window.location.href = targetUrl;
            else showAuthModal();
        }

        // --- SEARCH ---
        const searchToggleBtn = document.getElementById('searchToggleBtn');
        const searchInputWrapper = document.getElementById('searchInputWrapper');
        const searchInput = document.getElementById('searchInput');
        const suggestionsBox = document.getElementById('suggestionsBox');
        let isSearchOpen = false;

        searchToggleBtn.addEventListener('click', () => {
            triggerHaptic(); isSearchOpen = !isSearchOpen;
            if(isSearchOpen) {
                document.getElementById('mainHeader').classList.add('search-active');
                searchInputWrapper.classList.add('active');
                searchToggleBtn.classList.add('active');
                document.getElementById('searchIcon').className = 'fas fa-times';
                setTimeout(() => searchInput.focus(), 300);
            } else closeSearch();
        });

        function closeSearch() {
            document.getElementById('mainHeader').classList.remove('search-active');
            searchInputWrapper.classList.remove('active');
            searchToggleBtn.classList.remove('active');
            document.getElementById('searchIcon').className = 'fas fa-search';
            searchInput.value = ''; suggestionsBox.style.display = 'none';
            searchInput.blur(); isSearchOpen = false;
        }

        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            suggestionsBox.innerHTML = ''; 
            if (query.length > 0 && window.botDatabase) {
                const results = window.botDatabase.filter(b => b.name.toLowerCase().includes(query));
                if (results.length > 0) {
                    suggestionsBox.style.display = 'block';
                    suggestionsBox.innerHTML = `<div class="ai-header"><i class="fas fa-robot"></i> ${results.length} result(s)</div>`;
                    results.forEach(bot => {
                        const li = document.createElement('li');
                        li.innerHTML = `<i class="fas fa-bolt"></i> ${bot.name.replace(new RegExp(`(${query})`, "gi"), "<span class='highlight'>$1</span>")}`;
                        li.addEventListener('click', () => { triggerHaptic(); window.location.href = `details.html?id=${bot.id}`; });
                        suggestionsBox.appendChild(li);
                    });
                }
            } else suggestionsBox.style.display = 'none';
        });

        // Click animations
        document.addEventListener('click', function(e) {
            if (e.target.closest('.sleek-item') || e.target.closest('.hero-card') || e.target.closest('.filter-pill')) {
                triggerHaptic();
            }
        });

        const pills = document.querySelectorAll('.filter-pill');
        pills.forEach(pill => { pill.addEventListener('click', () => { pills.forEach(p => p.classList.remove('active')); pill.classList.add('active'); }); });
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAsP3AubiZpmvCRPngDePdvvQMiDTELCII",
            authDomain: "apple-bot-sell.firebaseapp.com",
            projectId: "apple-bot-sell",
            storageBucket: "apple-bot-sell.firebasestorage.app",
            messagingSenderId: "84956813839",
            appId: "1:84956813839:web:5c2451f102a2291eafe17a",
            measurementId: "G-DJW9L11S0B"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- SUPER ALGORITHM FUNCTION ---
        function renderSortedApps(appsData) {
            const slider = document.getElementById('topChartsSlider');
            const list = document.getElementById('trendingList');
            slider.innerHTML = ''; list.innerHTML = '';

            // AI Sorting Logic: Sort by Sales first, then Views
            // (If you haven't added sales/views in DB, it safely assumes 0 and sorts by default)
            let sortedApps = appsData.sort((a, b) => {
                let scoreA = (a.sales || 0) * 10 + (a.views || 0);
                let scoreB = (b.sales || 0) * 10 + (b.views || 0);
                return scoreB - scoreA;
            });

            // If empty
            if(sortedApps.length === 0) {
                list.innerHTML = `<div class="loading-text">No data found.</div>`;
                return;
            }

            // Top 3 for Hero Slider
            const topApps = sortedApps.slice(0, 3);
            const remainingApps = sortedApps.slice(3);

            // 1. Render Top Slider (Line System)
            topApps.forEach((data, index) => {
                const isNumberOne = index === 0;
                const badgeHtml = isNumberOne ? `<div class="hero-badge"><i class="fas fa-crown"></i> #1 Top Grossing</div>` : `<div class="hero-badge" style="background:rgba(255,149,0,0.9)"><i class="fas fa-fire"></i> Hot Pick</div>`;
                
                const card = `
                    <a href="details.html?id=${data.id}" class="hero-card">
                        ${badgeHtml}
                        <img src="${data.image || 'https://images.unsplash.com/photo-1611162617474-5b21e879e113?q=80&w=400&auto=format&fit=crop'}" class="hero-img" alt="${data.name}">
                        <div class="hero-info">
                            <div class="hero-text-box">
                                <div class="hero-name">${data.name || 'Unnamed App'}</div>
                                <div class="hero-cat">${data.network || 'Telegram Bot'}</div>
                            </div>
                            <div class="hero-btn">View</div>
                        </div>
                    </a>
                `;
                slider.innerHTML += card;
            });

            // 2. Render Remaining in Sleek List
            if(remainingApps.length > 0) {
                remainingApps.forEach(data => {
                    // Generate pseudo-stats if real ones missing, just to make UI look alive
                    const views = data.views || Math.floor(Math.random() * 500) + 100; 
                    const btnText = data.btnText || 'GET';

                    const item = `
                        <a href="details.html?id=${data.id}" class="sleek-item">
                            <img src="${data.image || 'https://images.unsplash.com/photo-1611162617474-5b21e879e113?q=80&w=400&auto=format&fit=crop'}" class="sleek-img" alt="${data.name}">
                            <div class="sleek-info">
                                <div class="sleek-name">${data.name || 'Unnamed App'} <i class="fas fa-arrow-trend-up trend-icon"></i></div>
                                <div class="sleek-category">${data.network || 'Telegram Project'}</div>
                                <div class="sleek-stats">
                                    <div class="stat-badge"><i class="fas fa-eye" style="color:var(--ios-blue)"></i> ${views}</div>
                                </div>
                            </div>
                            <div class="sleek-action">
                                <div class="sleek-price">${data.price || '$0.00'}</div>
                                <div class="sleek-btn">${btnText}</div>
                            </div>
                        </a>
                    `;
                    list.innerHTML += item;
                });
            } else {
                list.innerHTML = `<div class="loading-text">That's all for now!</div>`;
            }
        }

        // --- BACKGROUND FETCH & CACHING ---
        async function fetchTrendingBackground() {
            try {
                const querySnapshot = await getDocs(collection(db, "apps"));
                let fetchedApps = [];
                querySnapshot.forEach((doc) => { fetchedApps.push({ id: doc.id, ...doc.data() }); });
                
                // Save to Cache
                localStorage.setItem('nahid_trix_apps_cache', JSON.stringify(fetchedApps));
                localStorage.setItem('nahid_trix_last_fetch', Date.now().toString());

                // Set Global DB for Search
                window.botDatabase = fetchedApps.map(app => ({ id: app.id, name: app.name }));

                renderSortedApps(fetchedApps);
            } catch (error) {
                console.error("Fetch Error:", error);
                document.getElementById('trendingList').innerHTML = '<div class="loading-text" style="color:var(--ios-red);">Connection Error.</div>';
            }
        }

        // --- INIT STORE ---
        function initStore() {
            const cachedData = localStorage.getItem('nahid_trix_apps_cache');
            const lastFetch = localStorage.getItem('nahid_trix_last_fetch');
            const currentTime = Date.now();

            if (cachedData) {
                // Instant load from cache
                let parsedApps = JSON.parse(cachedData);
                window.botDatabase = parsedApps.map(app => ({ id: app.id, name: app.name }));
                renderSortedApps(parsedApps);
            }

            // Sync if cache is old (>5 mins) or doesn't exist
            if (!cachedData || !lastFetch || (currentTime - parseInt(lastFetch)) > 300000) {
                fetchTrendingBackground();
            }
        }

        initStore();
    </script>
</body>
</html>
