<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Create Post | NAHID TRIX</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* === iOS LIGHT THEME === */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        :root {
            --bg-main: #f2f2f7;          
            --bg-card: #ffffff;          
            --text-main: #1c1c1e;        
            --text-muted: #8e8e93;       
            --ios-blue: #007aff;         
            --ios-red: #ff3b30;
            --ios-green: #34c759;
            --border-color: rgba(0,0,0,0.08);     
            --shadow-soft: 0 4px 14px rgba(0,0,0,0.05);
            --shadow-strong: 0 10px 30px rgba(0,0,0,0.15);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-card); 
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* ====== CUSTOM ALERT SYSTEM ====== */
        #customAlert {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 350px; background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 15px 20px; border-radius: 18px; display: flex; align-items: center; gap: 12px;
            box-shadow: var(--shadow-strong); z-index: 99999;
            transition: 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            border: 0.5px solid var(--border-color);
        }
        #customAlert.show { top: 20px; }
        #alertIcon { font-size: 20px; }
        #alertMsg { font-size: 13px; font-weight: 500; line-height: 1.4; color: var(--text-main); }
        .alert-error { border-left: 5px solid var(--ios-red) !important; }
        .alert-error #alertIcon { color: var(--ios-red); }
        .alert-success { border-left: 5px solid var(--ios-green) !important; }
        .alert-success #alertIcon { color: var(--ios-green); }

        /* ====== HEADER ====== */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 18px; background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            position: sticky; top: 0; z-index: 1000; border-bottom: 0.5px solid var(--border-color); height: 50px; 
        }
        .cancel-btn { color: var(--text-main); font-size: 15px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .cancel-btn:active { opacity: 0.5; }
        .header-title { font-size: 16px; font-weight: 600; }
        .post-btn { 
            background: var(--ios-blue); color: #fff; border: none; 
            padding: 6px 16px; border-radius: 16px; font-size: 14px; font-weight: 600; 
            cursor: pointer; transition: 0.2s; 
        }
        .post-btn:active { transform: scale(0.95); opacity: 0.9; }
        .post-btn:disabled { background: var(--text-muted); cursor: not-allowed; transform: none; }

        /* ====== TABS ====== */
        .segment-container { padding: 15px 18px; background: var(--bg-card); }
        .segmented-control { display: flex; background: var(--bg-main); border-radius: 9px; padding: 3px; }
        .segment-btn { flex: 1; text-align: center; padding: 7px 0; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-radius: 7px; transition: 0.3s; }
        .segment-btn.active { background: #fff; color: var(--text-main); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        /* ====== FORM AREAS ====== */
        .tab-content { display: none; animation: fadeIn 0.3s ease; padding: 0 18px 20px 18px; max-width: 800px; margin: 0 auto; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .user-row { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-color);}
        .user-name { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 5px;}
        .verified-badge { color: var(--ios-blue); font-size: 13px; }

        /* Textarea Auto-resize */
        textarea {
            width: 100%; border: none; outline: none; font-family: 'Poppins', sans-serif;
            font-size: 16px; color: var(--text-main); resize: none; min-height: 80px;
            background: transparent; margin-bottom: 10px; overflow: hidden; line-height: 1.5;
        }
        textarea::placeholder { color: var(--text-muted); }

        /* Inputs for Project */
        .input-group { margin-bottom: 15px; }
        .input-group input, .input-group select {
            width: 100%; padding: 14px 15px; border: 1px solid var(--border-color);
            border-radius: 14px; font-family: 'Poppins', sans-serif; font-size: 14px;
            outline: none; background: var(--bg-main); transition: 0.2s;
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--ios-blue); background: #fff; box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1); }

        /* ====== IMAGE UPLOAD & PREVIEW ====== */
        .toolbar { display: flex; gap: 20px; border-top: 1px solid var(--border-color); padding-top: 15px; margin-top: 10px; }
        .upload-tool { color: var(--ios-blue); cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; transition: 0.2s; padding: 8px 12px; background: rgba(0,122,255,0.1); border-radius: 12px; }
        .upload-tool:active { transform: scale(0.95); }
        .upload-tool i { font-size: 18px; }

        .preview-container { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        .preview-box { position: relative; width: 100px; height: 100px; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-soft); border: 1px solid var(--border-color); animation: fadeIn 0.3s ease;}
        .preview-box img { width: 100%; height: 100%; object-fit: cover; }
        .remove-img { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); color: #fff; width: 24px; height: 24px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 10px; cursor: pointer; transition: 0.2s;}
        .remove-img:active { transform: scale(0.8); }

        .banner-preview { width: 100%; height: 160px; border-radius: 16px; object-fit: cover; margin-bottom: 15px; display: none; border: 1px solid var(--border-color); box-shadow: var(--shadow-soft); animation: fadeIn 0.3s ease;}

        /* ====== HASHTAG SUGGESTIONS (TikTok Style) ====== */
        .hashtag-popup {
            position: absolute; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px);
            border: 1px solid var(--border-color); border-radius: 12px; box-shadow: var(--shadow-strong);
            width: calc(100% - 36px); max-height: 200px; overflow-y: auto; z-index: 2000; display: none;
        }
        .hash-item { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 0.5px solid var(--border-color); cursor: pointer; }
        .hash-item:last-child { border-bottom: none; }
        .hash-item:active { background: var(--bg-main); }
        .hash-name { font-size: 14px; font-weight: 600; color: var(--text-main); }
        .hash-count { font-size: 11px; color: var(--text-muted); font-weight: 500; }

        /* ====== iOS HUD LOADER ====== */
        .loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3); z-index: 99999;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .loader-overlay.active { opacity: 1; pointer-events: auto; }
        .hud-box {
            background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 25px 30px; border-radius: 20px; display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2); transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .loader-overlay.active .hud-box { transform: scale(1); }
        .spinner { font-size: 38px; color: #fff; margin-bottom: 15px; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        #loaderText { font-weight: 600; font-size: 14px; color: #fff; font-family: 'Poppins', sans-serif; letter-spacing: 0.5px; }

    </style>
</head>
<body>

    <div id="customAlert">
        <i id="alertIcon" class="fas"></i>
        <div id="alertMsg"></div>
    </div>

    <div class="loader-overlay" id="loader">
        <div class="hud-box">
            <i class="fas fa-circle-notch spinner"></i>
            <div id="loaderText">Processing...</div>
        </div>
    </div>

    <header>
        <div class="cancel-btn" onclick="triggerHaptic(); history.back();">Cancel</div>
        <div class="header-title">Create Post</div>
        <button class="post-btn" id="submitPostBtn" onclick="submitPost()">Post</button>
    </header>

    <div class="segment-container">
        <div class="segmented-control">
            <div class="segment-btn active" onclick="switchTab('normal-post', this)">Status Update</div>
            <div class="segment-btn" onclick="switchTab('project-post', this)">Share Project</div>
        </div>
    </div>

    <div class="hashtag-popup" id="hashtagPopup"></div>

    <div id="normal-post" class="tab-content active">
        <div class="user-row">
            <img src="" id="postUserAvatar" class="user-avatar" alt="Avatar">
            <div class="user-name" id="postUserName">Loading... <i class="fab fa-telegram verified-badge"></i></div>
        </div>

        <textarea id="postText" placeholder="What's on your mind? Type # for tags..." oninput="autoResizeAndCheckHash(this)"></textarea>
        
        <div class="preview-container" id="postImagePreviews"></div>

        <div class="toolbar">
            <label class="upload-tool">
                <i class="fas fa-image"></i> <span>Add Photo</span>
                <input type="file" accept="image/*" hidden onchange="handleImageUpload(event, 'postImagePreviews')">
            </label>
        </div>
    </div>

    <div id="project-post" class="tab-content">
        <div class="input-group">
            <input type="text" id="projName" placeholder="Project Name (e.g. Tm Mini App)">
        </div>
        <div class="input-group">
            <input type="text" id="projPrice" placeholder="Price (e.g. $50.00 or Free)">
        </div>
        <div class="input-group">
            <select id="projCategory">
                <option value="" disabled selected>Select Category / Network</option>
                <option value="Telegram Bot">Telegram Bot</option>
                <option value="Mini App">Mini App (Adsgram/TON)</option>
                <option value="UI Kit">UI Kit / Design</option>
                <option value="Game">Tap Tap Game</option>
                <option value="Script">Source Code / Script</option>
            </select>
        </div>

        <textarea id="projDesc" placeholder="Describe your project... Type # for tags" oninput="autoResizeAndCheckHash(this)"></textarea>

        <img src="" id="mainBannerPreview" class="banner-preview">

        <div class="preview-container" id="projScreenshotPreviews"></div>

        <div class="toolbar">
            <label class="upload-tool">
                <i class="fas fa-rectangle-landscape"></i> <span>Main Banner</span>
                <input type="file" accept="image/*" hidden onchange="handleImageUpload(event, 'mainBannerPreview', true)">
            </label>
            <label class="upload-tool" style="background: rgba(52, 199, 89, 0.1); color: var(--ios-green);">
                <i class="fas fa-images"></i> <span>Screenshots</span>
                <input type="file" accept="image/*" multiple hidden onchange="handleMultipleUploads(event, 'projScreenshotPreviews')">
            </label>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // --- Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyAsP3AubiZpmvCRPngDePdvvQMiDTELCII",
            authDomain: "apple-bot-sell.firebaseapp.com",
            projectId: "apple-bot-sell",
            storageBucket: "apple-bot-sell.firebasestorage.app",
            messagingSenderId: "84956813839",
            appId: "1:84956813839:web:5c2451f102a2291eafe17a"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const tg = window.Telegram.WebApp;
        tg.expand();

        const IMGBB_API_KEY = 'c6e2935ef51e5af943ed900511bd715f';

        // --- User Identity Algorithm ---
        const tgUser = tg.initDataUnsafe?.user;
        let displayName = "Developer"; 
        let userHandle = "user";
        let userAvatar = "https://ui-avatars.com/api/?name=D&background=007aff&color=fff";

        if (tgUser) {
            const firstName = tgUser.first_name || "";
            const lastName = tgUser.last_name || "";
            const fullName = `${firstName} ${lastName}`.trim();

            if (fullName.length <= 16) displayName = fullName;
            else if (firstName.length <= 16) displayName = firstName;
            else displayName = firstName.substring(0, 15) + '...';

            userHandle = tgUser.username || String(tgUser.id);
            if (tgUser.photo_url) userAvatar = tgUser.photo_url;
            else userAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(displayName)}&background=007aff&color=fff`;
        }

        document.getElementById('postUserName').innerHTML = `${displayName} <i class="fab fa-telegram verified-badge"></i>`;
        document.getElementById('postUserAvatar').src = userAvatar;

        // --- Global Methods ---
        window.triggerHaptic = function() {
            if (navigator.vibrate) navigator.vibrate(40); 
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light'); 
        }

        // Custom Alert System
        window.showAlert = function(msg, type = 'error') {
            const alertBox = document.getElementById('customAlert');
            const icon = document.getElementById('alertIcon');
            const msgEl = document.getElementById('alertMsg');

            alertBox.className = type === 'error' ? 'alert-error' : 'alert-success';
            icon.className = type === 'error' ? 'fas fa-exclamation-circle' : 'fas fa-check-circle';
            msgEl.innerText = msg;

            alertBox.classList.add('show');
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(type === 'error' ? 'error' : 'success');

            setTimeout(() => { alertBox.classList.remove('show'); }, 3000);
        }

        window.switchTab = function(tabId, element) {
            window.triggerHaptic(); 
            document.querySelectorAll('.segment-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        }

        window.autoResizeAndCheckHash = function(textarea) {
            // Auto Resize Logic
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight) + 'px';
            
            // Hash Check Logic
            checkHashtag(textarea);
        }

        // ====== HASHTAG ALGORITHM ======
        const trendingTags = [
            { tag: "TelegramBot", count: "124K views" },
            { tag: "NahidTrixStore", count: "51.2K views" },
            { tag: "Airdrop", count: "89K views" },
            { tag: "TON", count: "32K views" },
            { tag: "MiniApp", count: "105K views" },
            { tag: "SourceCode", count: "12K views" },
            { tag: "TapGame", count: "45K views" }
        ];

        const popup = document.getElementById('hashtagPopup');
        let currentActiveTextarea = null;

        function checkHashtag(textarea) {
            currentActiveTextarea = textarea;
            const text = textarea.value;
            const cursorPos = textarea.selectionStart;
            const textBeforeCursor = text.substring(0, cursorPos);
            
            const words = textBeforeCursor.split(/[\s\n]+/);
            const lastWord = words[words.length - 1];

            if (lastWord.startsWith('#')) {
                const query = lastWord.substring(1).toLowerCase();
                const matchedTags = trendingTags.filter(t => t.tag.toLowerCase().includes(query));
                
                if(matchedTags.length > 0) showHashtagPopup(matchedTags, textarea);
                else popup.style.display = 'none';
            } else {
                popup.style.display = 'none';
            }
        }

        function showHashtagPopup(tags, textarea) {
            const rect = textarea.getBoundingClientRect();
            popup.style.top = (rect.top + window.scrollY + 30) + 'px';
            popup.style.left = '18px';
            
            popup.innerHTML = '';
            tags.forEach(t => {
                const div = document.createElement('div');
                div.className = 'hash-item';
                div.innerHTML = `<span class="hash-name">#${t.tag}</span> <span class="hash-count">${t.count}</span>`;
                div.onclick = function() { window.triggerHaptic(); insertHashtag(t.tag); };
                popup.appendChild(div);
            });
            popup.style.display = 'block';
        }

        function insertHashtag(tagWord) {
            if(!currentActiveTextarea) return;
            const text = currentActiveTextarea.value;
            const cursorPos = currentActiveTextarea.selectionStart;
            
            const textBeforeCursor = text.substring(0, cursorPos);
            const textAfterCursor = text.substring(cursorPos);
            
            const wordsBefore = textBeforeCursor.split(/[\s\n]+/);
            wordsBefore.pop(); 
            
            const newBefore = wordsBefore.join(' ') + (wordsBefore.length > 0 ? ' ' : '') + '#' + tagWord + ' ';
            
            currentActiveTextarea.value = newBefore + textAfterCursor;
            currentActiveTextarea.focus();
            currentActiveTextarea.selectionStart = newBefore.length;
            currentActiveTextarea.selectionEnd = newBefore.length;
            
            popup.style.display = 'none';
        }

        document.addEventListener('click', (e) => {
            if(!popup.contains(e.target) && e.target.tagName !== 'TEXTAREA') popup.style.display = 'none';
        });

        // ====== IMAGE COMPRESSION & UPLOAD ALGORITHM ======
        let postImages = [];
        let projectBannerUrl = "";
        let projectScreenshots = [];

        // Client-side Image Compression function
        function compressImage(file, maxWidth = 1200, quality = 0.8) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // Get Base64 string without the prefix
                        const base64String = canvas.toDataURL('image/jpeg', quality).split(',')[1];
                        resolve(base64String);
                    }
                }
            });
        }

        async function uploadToImgBB(file) {
            try {
                // Compress image before upload to save data and time
                const base64Image = await compressImage(file);
                
                const formData = new FormData();
                formData.append('image', base64Image); // ImgBB accepts base64
                
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
                const data = await response.json();
                
                if(data.success) return data.data.url;
                else throw new Error("Upload failed");
            } catch (error) {
                console.error(error);
                showAlert("Image upload failed. Check connection.");
                return null;
            }
        }

        function showLoader(text = "Processing...") {
            document.getElementById('loaderText').innerText = text;
            document.getElementById('loader').classList.add('active');
        }

        function hideLoader() { document.getElementById('loader').classList.remove('active'); }

        window.handleImageUpload = async function(event, targetContainerId, isBanner = false) {
            const file = event.target.files[0];
            if(!file) return;

            window.triggerHaptic();
            showLoader("Compressing & Uploading...");

            const url = await uploadToImgBB(file);
            hideLoader();

            if(url) {
                if(isBanner) {
                    projectBannerUrl = url;
                    const bannerImg = document.getElementById(targetContainerId);
                    bannerImg.src = url;
                    bannerImg.style.display = 'block';
                } else {
                    postImages.push(url);
                    renderPreviews(postImages, targetContainerId, 'postImages');
                }
            }
            event.target.value = ''; 
        }

        window.handleMultipleUploads = async function(event, targetContainerId) {
            const files = event.target.files;
            if(files.length === 0) return;

            window.triggerHaptic();
            showLoader(`Uploading ${files.length} images...`);

            for(let i=0; i<files.length; i++) {
                const url = await uploadToImgBB(files[i]);
                if(url) projectScreenshots.push(url);
            }
            
            hideLoader();
            renderPreviews(projectScreenshots, targetContainerId, 'projectScreenshots');
            event.target.value = ''; 
        }

        function renderPreviews(arrayRef, containerId, arrayName) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            arrayRef.forEach((url, index) => {
                container.innerHTML += `
                    <div class="preview-box">
                        <img src="${url}">
                        <div class="remove-img" onclick="removeImage(${index}, '${arrayName}', '${containerId}')"><i class="fas fa-times"></i></div>
                    </div>
                `;
            });
        }

        window.removeImage = function(index, arrayName, containerId) {
            window.triggerHaptic();
            if(arrayName === 'postImages') {
                postImages.splice(index, 1);
                renderPreviews(postImages, containerId, arrayName);
            } else if (arrayName === 'projectScreenshots') {
                projectScreenshots.splice(index, 1);
                renderPreviews(projectScreenshots, containerId, arrayName);
            }
        };


        // ====== SUBMIT POST LOGIC (FIREBASE) ======
        window.submitPost = async function() {
            window.triggerHaptic();
            const btn = document.getElementById('submitPostBtn');
            const isNormalPost = document.getElementById('normal-post').classList.contains('active');
            
            if (isNormalPost) {
                const text = document.getElementById('postText').value.trim();
                if(text === "" && postImages.length === 0) {
                    showAlert("Write something or add a photo!");
                    return;
                }

                btn.disabled = true;
                showLoader("Publishing Post...");

                try {
                    // নরমাল স্ট্যাটাস সরাসরি posts ডাটাবেসে যাবে (সবাই দেখতে পাবে)
                    await addDoc(collection(db, "posts"), {
                        authorName: displayName,
                        authorHandle: userHandle,
                        authorAvatar: userAvatar,
                        content: text,
                        image: postImages.length > 0 ? postImages[0] : null,
                        likes: 0,
                        comments: 0,
                        views: Math.floor(Math.random() * 500) + 50,
                        createdAt: serverTimestamp()
                    });
                    
                    hideLoader();
                    showAlert("Post published!", "success");
                    setTimeout(() => { window.location.href = 'feed.html'; }, 1000);
                } catch(e) {
                    console.error("Error creating post", e);
                    showAlert("Failed to publish. Try again.");
                    btn.disabled = false;
                    hideLoader();
                }

            } else {
                // Share Project (এখন এটি Review-এর জন্য যাবে)
                const name = document.getElementById('projName').value.trim();
                const price = document.getElementById('projPrice').value.trim();
                const cat = document.getElementById('projCategory').value;
                const desc = document.getElementById('projDesc').value.trim();

                if(!name || !price || !cat || !projectBannerUrl) {
                    showAlert("Please fill all details & upload Main Banner!");
                    return;
                }

                btn.disabled = true;
                showLoader("Submitting for Review...");

                try {
                    // মেইন apps ডাটাবেসের বদলে pending_projects এ জমা হবে
                    await addDoc(collection(db, "pending_projects"), {
                        name: name,
                        price: price,
                        network: cat,
                        description: desc,
                        image: projectBannerUrl,
                        screenshots: projectScreenshots,
                        developerName: displayName,      // যে আপলোড করেছে তার নাম
                        developerAvatar: userAvatar,     // তার ছবি
                        developerId: userHandle,         // তার আইডি
                        status: "pending",               // স্ট্যাটাস পেন্ডিং
                        btnText: "GET",
                        isFullWidth: false,
                        createdAt: serverTimestamp()
                    });

                    hideLoader();
                    // ইউজারকে একটি সুন্দর মেসেজ দেওয়া হবে
                    showAlert("Submitted for Admin Review!", "success");
                    
                    // ২ সেকেন্ড পর ফিড পেজে পাঠিয়ে দেওয়া হবে
                    setTimeout(() => { window.location.href = 'feed.html'; }, 2000);
                } catch(e) {
                    console.error("Error submitting project", e);
                    showAlert("Submission failed. Try again.");
                    btn.disabled = false;
                    hideLoader();
                }
            }
        }

    </script>
</body>
</html>
